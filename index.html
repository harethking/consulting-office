  'migrate-local': async () => {
    if (!isOwner()) return;
    let d = null;
    try { d = JSON.parse(localStorage.getItem('ofc2_db')); } catch (e) { d = null; }
    if (!d || !Array.isArray(d.projects) || !d.projects.length) return toast('لا توجد بيانات محلية', 'err');
    if (!confirm(`رفع ${d.projects.length} مشروع من النسخة المحلية القديمة إلى الخادم؟`)) return;
    let n = 0;
    for (const lp of d.projects) {
      normProject(lp);
      const data = { models: lp.models, buildings: lp.buildings, testCats: lp.testCats.map(c => ({ id: c.id, name: c.name })), nextNo: lp.nextNo };
      const row = await q(sb.from('projects').insert({ name: lp.name, type: lp.type, client: lp.client || '', location: lp.location || '', color: lp.color || PALETTE[0], data }).select('id').single());
      const recs = lp.testCats.flatMap(c => c.records.map(r => ({
        project_id: row.id, cat_id: c.id, unit_id: r.unitId || '', unit: r.unit || '', test_date: r.date || null, sample: r.sample || '', result: r.result || '',
        status: STATUS[r.status] ? r.status : 'pending', notes: r.notes || '', by_name: r.by || '', created_by: S.user.id
      })));
      for (let i = 0; i < recs.length; i += 500) await q(sb.from('test_records').insert(recs.slice(i, i + 500)));
      const vis = (lp.visits || []).map(v => ({ project_id: row.id, visit_date: v.date || null, notes: v.notes || '-', open: !!v.open, by_name: v.by || '', created_by: S.user.id }));
      if (vis.length) await q(sb.from('visits').insert(vis));
      n++;
    }
    localStorage.removeItem('ofc2_db');
    await loadHome();
    S.view = 'home'; render();
    toast(`تم رفع ${n} مشروع`, 'ok');
  }
};

/* ================= حفظ النماذج ================= */
const FORMS = {
  login: fd => doLogin(fd),
  register: fd => doRegister(fd),

  project: async fd => {
    if (!need('admin')) return;
    const type = fd.get('type');
    const name = (fd.get('name') || '').trim();
    if (!name) return toast('اكتب اسم المشروع', 'err');
    const p = { type, models: [], buildings: [], nextNo: 1, testCats: DEFAULT_CATS.map(n => ({ id: uid(), name: n, records: [] })) };
    if (type === 'complex') {
      const total = +fd.get('total') || 0;
      const names = fd.getAll('mname'), counts = fd.getAll('mcount'), areas = fd.getAll('marea');
      const defs = [];
      let used = 0;
      names.forEach((n, i) => {
        const c = +counts[i] || 0;
        if (!c && !n.trim()) return;
        used += c;
        defs.push([n.trim() || 'نموذج ' + (defs.length + 1), c, +areas[i] || 0]);
      });
      if (total && used > total) return toast('مجموع المنازل أكبر من إجمالي المجمع', 'err');
      if (total && total - used > 0) defs.push(['باقي الوحدات', total - used, 0]);
      if (!defs.length) return toast('أضف نموذجاً واحداً على الأقل', 'err');
      if (defs.reduce((a, x) => a + x[1], 0) > 5000) return toast('الحد الأعلى 5000 منزل للمشروع', 'err');
      defs.forEach(([n, c, a], i) => {
        const m = { id: uid(), name: n, area: a, color: PALETTE[i % PALETTE.length], stages: makeStages(p, false), houses: [] };
        for (let k = 0; k < c; k++) m.houses.push({ id: uid(), no: p.nextNo++, prog: {}, note: '', w: a > 0 ? a : 1 });
        p.models.push(m);
      });
    } else {
      const n = +fd.get('count') || 0;
      if (n < 1 || n > 500) return toast('أدخل عدد البنايات (1 – 500)', 'err');
      for (let i = 1; i <= n; i++) p.buildings.push({ id: uid(), name: 'بناية ' + i, color: PALETTE[(i - 1) % PALETTE.length], stages: makeStages(p, true), note: '' });
    }
    const data = { models: p.models, buildings: p.buildings, testCats: p.testCats.map(c => ({ id: c.id, name: c.name })), nextNo: p.nextNo };
    const row = await q(sb.from('projects').insert({
      name, type, client: (fd.get('client') || '').trim(), location: (fd.get('location') || '').trim(),
      color: PALETTE[S.projects.length % PALETTE.length], data, updated_by: S.user.id
    }).select('id').single());
    S.pendingLogs.push({ pid: row.id, t: Date.now(), by: S.user.name, role: S.user.role, kind: 'other', text: `أنشأ المشروع ${name} (${TYPE_LABEL[type]})` });
    await flushLogs();
    await enterProject(row.id);
    S.view = 'site';
    render();
  },

  editproj: async fd => {
    if (!need('admin')) return;
    const p = S.p;
    const name = (fd.get('name') || '').trim();
    if (!name) return toast('الاسم مطلوب', 'err');
    Object.assign(p, { name, client: (fd.get('client') || '').trim(), location: (fd.get('location') || '').trim(), color: fd.get('color') || p.color });
    logP(p, { kind: 'other', text: 'عدّل بيانات المشروع' });
    if (await saveDoc()) { closeModal(); render(); }
  },

  model: async (fd, f) => {
    if (!need('admin')) return;
    const p = S.p;
    const name = (fd.get('name') || '').trim();
    const count = Math.max(0, +fd.get('count') || 0);
    if (!name) return toast('الاسم مطلوب', 'err');
    let m = getM(p, f.dataset.m);
    const isNew = !m;
    if (m && count < m.houses.length && !confirm(`سيتم حذف ${m.houses.length - count} منزل (الأرقام الأكبر) من هذا النموذج مع نسب إنجازها. متابعة؟`)) return;
    if (isNew) {
      const base = p.models[0];
      m = { id: uid(), name, area: 0, color: '', stages: base ? base.stages.map(s => ({ id: uid(), name: s.name, test: s.test, w: wt(s) })) : makeStages(p, false), houses: [] };
      p.models.push(m);
    }
    if (count < m.houses.length) { m.houses.sort((a, b) => a.no - b.no); m.houses.splice(count); }
    while (m.houses.length < count) m.houses.push({ id: uid(), no: p.nextNo++, prog: {}, note: '', w: +fd.get('area') || 1 });
    Object.assign(m, { name, area: +fd.get('area') || 0, color: fd.get('color') || PALETTE[0] });
    const hv = String(fd.get('hw') || '').trim();
    const areaV = +fd.get('area') || 0;
    if (hv !== '') { const nv = Math.max(0, parseFloat(hv) || 0); m.houses.forEach(h => { h.w = nv; }); }
    else if (areaV > 0) m.houses.forEach(h => { h.w = areaV; });
    logP(p, { kind: 'other', text: isNew ? `أضاف النموذج ${name} (${count} منزل)` : `عدّل النموذج ${name}` });
    if (await saveDoc()) { closeModal(); render(); }
  },

  stages: async (fd, f) => {
    if (!need('stages')) return;
    const p = S.p, m = getM(p, f.dataset.m);
    if (!m) return;
    const rows = readStageRows(f).filter(r => r.name);
    const apply = (model, list) => {
      const keep = new Set(list.map(s => s.id));
      model.stages.forEach(s => { if (!keep.has(s.id)) model.houses.forEach(h => { delete h.prog[s.id]; }); });
      model.stages = list;
    };
    apply(m, rows.map(r => ({ id: r.id || uid(), name: r.name, test: r.test, w: r.w })));
    const all = fd.get('all') === 'on';
    if (all) {
      p.models.filter(x => x !== m).forEach(x => apply(x, rows.map(r => {
        const same = x.stages.find(s => s.name === r.name);
        return { id: same ? same.id : uid(), name: r.name, test: r.test, w: r.w };
      })));
    }
    logP(p, { kind: 'stages', text: all ? `رتّب فقرات كل النماذج (${rows.length} فقرة)` : `رتّب فقرات النموذج ${m.name} (${rows.length} فقرة)` });
    if (await saveDoc()) { closeModal(); render(); }
  },

  house: async (fd, f) => {
    if (!need('progress')) return;
    const p = S.p;
    const u = unitById(p, f.dataset.id);
    if (!u) return;
    let n = 0;
    u.stages.forEach(s => { if (fd.has('s_' + s.id) && setStagePct(p, u, s.id, fd.get('s_' + s.id))) n++; });
    const note = (fd.get('note') || '').trim();
    if (note !== (u.house.note || '')) { u.house.note = note; logP(p, { kind: 'other', unitId: u.id, text: `ملاحظة على ${u.label}: ${note.slice(0, 80)}` }); n++; }
    if (fd.has('w') && can('stages')) { const nw = Math.max(0, parseFloat(fd.get('w')) || 0); if (nw !== wt(u.house)) { u.house.w = nw; logP(p, { kind: 'other', unitId: u.id, text: `غيّر وزن ${u.label} إلى ${nw}` }); n++; } }
    if (!n) { closeModal(); return toast('لا توجد تغييرات'); }
    if (await saveDoc()) { closeModal(); render(); toast('تم حفظ تحديثات ' + u.label, 'ok'); }
  },

  bld: async (fd, f) => {
    const p = S.p;
    let b = p.buildings.find(x => x.id === f.dataset.id);
    const isNew = !b;
    if (isNew && !need('admin')) return;
    if (!isNew && !(can('stages') || can('progress'))) return;
    const rows = readStageRows(f).filter(r => r.name);
    if (isNew) { b = { id: uid(), name: '', color: '', stages: [], note: '' }; p.buildings.push(b); }
    if (isAdmin()) {
      const name = (fd.get('name') || '').trim() || b.name || 'بناية';
      if (!isNew && name !== b.name) logP(p, { kind: 'other', unitId: b.id, text: `غيّر اسم ${b.name} إلى ${name}` });
      b.name = name;
      b.color = fd.get('color') || b.color || PALETTE[0];
      b.kind = fd.get('kind') === 'infra' ? 'infra' : 'building';
      const wv = String(fd.get('w') || '').trim();
      b.w = wv === '' ? 1 : Math.max(0, parseFloat(wv) || 0);
    }
    if (can('stages')) {
      const old = new Map(b.stages.map(s => [s.id, s]));
      const changed = rows.length !== b.stages.length || rows.some((r, i) => !b.stages[i] || r.id !== b.stages[i].id || r.name !== b.stages[i].name || r.test !== b.stages[i].test);
      b.stages = rows.map(r => { const o = old.get(r.id); return { id: r.id || uid(), name: r.name, test: r.test, w: r.w, pct: o ? pct(o.pct) : 0 }; });
      if (changed && !isNew) logP(p, { kind: 'stages', unitId: b.id, text: `رتّب فقرات ${b.name} (${b.stages.length} فقرة)` });
    }
    if (can('progress')) {
      const u = unitById(p, b.id);
      rows.forEach((r, i) => {
        const s = can('stages') ? b.stages[i] : b.stages.find(x => x.id === r.id);
        if (!s) return;
        if (isNew) s.pct = r.pct; else setStagePct(p, u, s.id, r.pct);
      });
    }
    const note = (fd.get('note') || '').trim();
    if (fd.has('note') && note !== (b.note || '')) { b.note = note; if (!isNew) logP(p, { kind: 'other', unitId: b.id, text: `ملاحظة على ${b.name}: ${note.slice(0, 80)}` }); }
    if (isNew) logP(p, { kind: 'other', unitId: b.id, text: `أضاف ${b.name}` });
    if (await saveDoc()) { closeModal(); render(); toast('تم الحفظ', 'ok'); }
  },

  bulk: async fd => {
    if (!need('progress')) return;
    const p = S.p;
    const name = fd.get('stage'), model = fd.get('model'), val = pct(fd.get('val'));
    let a = +fd.get('from'), z = +fd.get('to');
    if (a > z) [a, z] = [z, a];
    const targets = units(p).filter(u => (model === 'all' || (u.model && u.model.id === model)) && u.no >= a && u.no <= z);
    if (!targets.length) return toast('لا توجد منازل في هذا المدى', 'err');
    let n = 0;
    targets.forEach(u => { const s = u.stages.find(x => x.name === name); if (s && setStagePct(p, u, s.id, val)) n++; });
    if (!n) { closeModal(); return toast('لا توجد تغييرات'); }
    if (await saveDoc()) { closeModal(); render(); toast(`تم تحديث "${name}" إلى ${val}% في ${n} منزل`, 'ok'); }
  },

  cat: async fd => {
    if (!need('tests')) return;
    const p = S.p;
    const name = (fd.get('name') || '').trim();
    if (!name) return;
    if (p.testCats.some(c => c.name === name)) return toast('هذا الصنف موجود', 'err');
    p.testCats.push({ id: uid(), name, records: [] });
    logP(p, { kind: 'other', text: `أضاف صنف فحص جديد: ${name}` });
    if (await saveDoc()) { openModal('أصناف الفحوصات', catsForm(S.p)); render(); }
  },

  rec: async (fd, f) => {
    if (!need('tests')) return;
    const p = S.p;
    const c = p.testCats.find(x => x.id === fd.get('cat'));
    if (!c) return toast('اختر صنف الفحص', 'err');
    const raw = (fd.get('unit') || '').trim();
    if (!raw) return toast('حدد الوحدة أو الزون', 'err');
    const newFiles = (fd.getAll('files') || []).filter(x => x && x.size);
    const list = expandUnits(p, raw);
    if (!list) return toast('النطاق كبير جداً', 'err');
    if (list.length > 1 && !f.dataset.id) return saveManyRecs(p, c, fd, list, newFiles);
    const u = matchUnit(p, raw);
    const old = f.dataset.id ? findRec(p, f.dataset.oldcat, f.dataset.id) : null;
    const rec = old && old.r ? Object.assign({}, old.r) : { id: uuid(), files: [], by: S.user.name, createdBy: S.user.id, t: Date.now() };
    Object.assign(rec, {
      catId: c.id, unitId: u ? u.id : '', unit: u ? u.label : raw, date: fd.get('date') || '',
      sample: (fd.get('sample') || '').trim(), lab: (fd.get('lab') || '').trim(), result: (fd.get('result') || '').trim(),
      status: fd.get('status') || 'pending', notes: (fd.get('notes') || '').trim()
    });
    const rm = fd.getAll('rmfile');
    S.lastWrite = Date.now();
    setSync(true);
    if (newFiles.length) toast(`جارٍ رفع ${newFiles.length} ملف…`);
    const uploaded = await uploadFiles(p.id, rec.id, newFiles);
    rec.files = rec.files.filter(x => !rm.includes(x.path)).concat(uploaded);
    try {
      if (old && old.r) {
        const row = recToRow(rec, p.id);
        delete row.id; delete row.project_id; delete row.by_name;
        await q(sb.from('test_records').update(row).eq('id', rec.id));
        await removeFiles(rm);
        old.c.records = old.c.records.filter(x => x.id !== rec.id);
        c.records.push(rec);
        logP(p, { kind: 'test', unitId: rec.unitId, text: `عدّل ${c.name} ${toLabel(rec.unit)}: ${STATUS[rec.status]}${rec.result ? ' (' + rec.result + ')' : ''}` });
      } else {
        const row = await q(sb.from('test_records').insert(Object.assign(recToRow(rec, p.id), { created_by: S.user.id })).select('created_at').single());
        rec.t = Date.parse(row.created_at);
        c.records.push(rec);
        logP(p, { kind: 'test', unitId: rec.unitId, text: `أضاف ${c.name} ${toLabel(rec.unit)}: ${STATUS[rec.status]}${rec.result ? ' (' + rec.result + ')' : ''}${uploaded.length ? ' مع ' + uploaded.length + ' ملف' : ''}` });
      }
    } catch (e) {
      await removeFiles(uploaded.map(x => x.path));
      throw e;
    } finally { setSync(false); }
    await flushLogs();
    closeModal(); render();
    toast(u ? `تم حفظ الفحص وربطه ب${u.label}` : `تم حفظ الفحص للزون "${raw}"`, 'ok');
  },

  visit: async fd => {
    if (!need('visits')) return;
    const p = S.p;
    const notes = (fd.get('notes') || '').trim();
    if (!notes) return;
    S.lastWrite = Date.now();
    const row = await q(sb.from('visits').insert({ project_id: p.id, visit_date: fd.get('date') || null, notes, open: fd.get('open') === 'on', by_name: S.user.name, created_by: S.user.id }).select('*').single());
    p.visits.unshift(visitFromRow(row));
    logP(p, { kind: 'visit', text: `أضاف زيارة/ملاحظة: ${notes.slice(0, 80)}` });
    await flushLogs();
    render();
  },

  pw: async fd => {
    const nw = fd.get('nw') || '';
    if (nw.length < 6) return toast('كلمة المرور الجديدة 6 أحرف على الأقل', 'err');
    const { error: e1 } = await sb.auth.signInWithPassword({ email: toEmail(S.user.username), password: fd.get('old') || '' });
    if (e1) return toast('كلمة المرور الحالية غير صحيحة', 'err');
    const { error } = await sb.auth.updateUser({ password: nw });
    if (error) throw error;
    render(); toast('تم تغيير كلمة المرور', 'ok');
  },
  office: async fd => {
    if (!need('admin')) return;
    const name = (fd.get('name') || '').trim();
    await q(sb.from('office').update({ name }).eq('id', 1));
    S.office.name = name;
    render(); toast('تم الحفظ', 'ok');
  },
  ai: async fd => {
    if (!isOwner()) return toast('للمدير الرئيسي فقط', 'err');
    S.aiStatus = await api('ai-key', { key: (fd.get('key') || '').trim(), model: (fd.get('model') || '').trim() });
    S.office.ai_enabled = S.aiStatus.enabled;
    render(); toast('تم حفظ إعدادات المهندس الذكي', 'ok');
  }
};

/* ================= ربط الأحداث ================= */
function lock(on) {
  S.busy = on;
  $$('#modal button.primary, main button.primary, .authbox button.primary').forEach(b => { b.disabled = on; });
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.preventDefault();
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  try { await fn(el.dataset, el); }
  catch (err) { console.error(err); toast(errMsg(err), 'err'); if (S.p && /conflict|version/i.test(String(err))) reloadProject(); }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'aiform') {
    const i = f.querySelector('input');
    const qs = i.value;
    i.value = '';
    aiAsk(qs);
    return;
  }
  const fn = FORMS[f.dataset.form];
  if (!fn || S.busy) return;
  lock(true);
  try { await fn(new FormData(f), f); }
  catch (err) { console.error(err); toast(errMsg(err), 'err'); }
  finally {
    lock(false);
    if (S.stale && $('#modal').hidden && S.p) reloadProject(true);
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.type === 'range') { const o = t.parentNode.querySelector('output'); if (o) o.textContent = t.value + '%'; }
  const f = t.closest('form');
  if (f && f.dataset.form === 'project') updRemain(f);
  const key = t.dataset.filter === 'q' ? 'filter' : t.dataset.tfilter === 'q' ? 'tf' : '';
  if (key) {
    S[key].q = t.value;
    const pos = t.selectionStart;
    render();
    const ni = $(key === 'filter' ? '[data-filter=q]' : '[data-tfilter=q]');
    if (ni) { ni.focus(); try { ni.setSelectionRange(pos, pos); } catch (err) { /* تجاهل */ } }
  }
});

document.addEventListener('change', async e => {
  const t = e.target;
  try {
    if (t.dataset.filter === 'st' || t.dataset.filter === 'model') { S.filter[t.dataset.filter] = t.value; render(); return; }
    if (t.dataset.tfilter === 'st') { S.tf.st = t.value; render(); return; }
    if (t.dataset.chg === 'stg-model') { const m = getM(S.p, t.value); if (m) openModal('ترتيب فقرات الإنجاز', stagesForm(S.p, m)); return; }
    if (t.dataset.chg === 'rec') {
      if (!need('tests')) return;
      const p = S.p;
      const { c, r } = findRec(p, t.dataset.c, t.dataset.id);
      if (!r) return;
      S.lastWrite = Date.now();
      await q(sb.from('test_records').update({ status: t.value }).eq('id', r.id));
      r.status = t.value;
      logP(p, { kind: 'test-status', unitId: r.unitId, text: `غيّر حالة ${c.name} ${toLabel(r.unit)} إلى ${STATUS[r.status]}` });
      await flushLogs();
      render();
    }
    if (t.dataset.chg === 'role') {
      if (!need('admin')) return;
      const u = userById(t.dataset.id);
      if (!u || u.id === S.user.id || u.is_owner) return;
      if (u.status === 'pending') return;
      await q(sb.from('profiles').update({ role: t.value }).eq('id', u.id));
      u.role = t.value;
      render(); toast('تم تغيير الدور', 'ok');
    }
  } catch (err) { console.error(err); toast(errMsg(err), 'err'); render(); }
});

$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });

(async function init() {
  if (!configured) { S.boot = false; return render(); }
  render();
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && S.user) { S.user = null; S.p = null; unsubscribe(); resetAI(); render(); } });
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) await afterAuth();
    else { S.boot = false; render(); }
  } catch (e) {
    S.boot = false; render(); toast(errMsg(e), 'err');
  }
})();
</script>
