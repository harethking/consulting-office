<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام إدارة المكتب الاستشاري</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#e6f6fe;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#dbeafe;--brand:#0284c7;--brand2:#0ea5e9;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--info:#0891b2;--side1:#0369a1;--side2:#0ea5e9;--gold:#d4af37}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Segoe UI",Tahoma,Arial,sans-serif}
h1,h2,h3{margin:0}
button{font:inherit;cursor:pointer;border-radius:10px;padding:8px 14px;border:1px solid transparent;background:#fff;color:var(--ink)}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #bae6fd;border-radius:10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #7dd3fc;border-color:#38bdf8}
input:disabled,select:disabled,textarea:disabled{background:#f1f5f9;color:#64748b}
input[type=checkbox],input[type=radio]{width:auto}
input[type=range]{padding:0;border:none;accent-color:var(--brand)}
input[type=color]{padding:2px;height:40px}
input[type=file]{padding:6px;background:#f0f9ff;border-style:dashed}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:#334155}
label.chk{flex-direction:row;align-items:center;gap:8px}
.primary{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;box-shadow:0 4px 12px -4px rgba(2,132,199,.6)}
.ghost{background:#fff;border-color:#bae6fd}
.ghost:hover{background:#f0f9ff}
.danger{background:#fff;color:var(--bad);border-color:#fecaca}
.okb{background:var(--ok);color:#fff}
.x{background:none;border:none;color:var(--bad);font-size:16px;padding:4px 8px}
.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(3,105,161,.06)}
.card h3{font-size:16px}
.empty{text-align:center;color:var(--muted);padding:36px 10px}
.center{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}

/* الواجهة الخارجية */
.ohead{background:linear-gradient(135deg,var(--side1),var(--side2));color:#fff;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ohead .ghost{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)}
.ohead .ghost.on{background:#fff;color:var(--side1)}
.ohead .cnt{margin:0 4px 0 0}
.pick-card{background:#fff;border:1px solid var(--line);border-top:6px solid var(--c);border-radius:16px;padding:18px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.pick-card:hover{transform:translateY(-3px);box-shadow:0 14px 28px -14px rgba(3,105,161,.5)}

/* هيكل المشروع */
.shell{display:flex;min-height:100vh}
.side{width:255px;flex:none;background:linear-gradient(180deg,var(--side1),var(--side2));color:#f0f9ff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;z-index:70}
.brand{padding:18px;display:flex;gap:10px;align-items:center;color:#fff;border-bottom:1px solid rgba(255,255,255,.15)}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#f5d77a,#d4af37);display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.projbox{margin:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25)}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:#f0f9ff;padding:10px 12px;border-radius:10px;text-align:right}
.nav button:hover{background:rgba(255,255,255,.12)}
.nav button.on{background:rgba(255,255,255,.28);font-weight:600}
.ic{width:18px;height:18px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.cnt{margin-right:auto;background:#ef4444;color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px}
.me{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.15);display:flex;flex-direction:column;gap:10px;color:#fff}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.exitbtn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.45);width:100%;display:flex;gap:8px;align-items:center;justify-content:center}
.mainwrap{flex:1;min-width:0}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:10px}
.topbar h2{font-size:18px}
.menu{display:none}
main{padding:20px;max-width:1280px;margin:0 auto}
.backdrop{display:none}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.busy i{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* شارات */
.badge{font-size:12px;padding:2px 10px;border-radius:99px;background:#e0f2fe;color:#0369a1;white-space:nowrap;display:inline-block}
.badge.ok{background:#dcfce7;color:#15803d}
.badge.warn{background:#fef3c7;color:#b45309}
.badge.bad{background:#fee2e2;color:#b91c1c}
.badge.gold{background:#fef9c3;color:#a16207;border:1px solid #fde047}
.role{font-size:12px;padding:2px 10px;border-radius:99px;white-space:nowrap;display:inline-block}
.role.admin{background:#ede9fe;color:#6d28d9}
.role.staff{background:#dbeafe;color:#1d4ed8}
.role.contractor{background:#ffedd5;color:#c2410c}

/* بطاقات الإحصاء */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.tile{border-radius:16px;padding:14px 16px;color:#fff;box-shadow:0 8px 20px -10px rgba(0,0,0,.4);font-size:13px}
.tile b{display:block;font-size:26px;line-height:1.3}
.t1{background:linear-gradient(135deg,#0284c7,#38bdf8)}
.t2{background:linear-gradient(135deg,#059669,#34d399)}
.t3{background:linear-gradient(135deg,#d97706,#fbbf24)}
.t4{background:linear-gradient(135deg,#dc2626,#f87171)}
.t5{background:linear-gradient(135deg,#7c3aed,#a78bfa)}
.t6{background:linear-gradient(135deg,#0891b2,#22d3ee)}

/* الإنجاز */
.bar{height:10px;background:#e0f2fe;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.barlbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:3px}
.phead{border-radius:18px;padding:18px 20px;color:#fff;background:linear-gradient(135deg,var(--c),#0c4a6e 170%);margin-bottom:16px}
.phead .bar{background:rgba(255,255,255,.3)}
.phead .bar i{background:#fff}
.phead .barlbl{color:rgba(255,255,255,.9)}
.phead .ghost{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)}
.phead .danger{background:rgba(255,255,255,.15);color:#fee2e2;border-color:rgba(254,202,202,.6)}

/* النماذج والمنازل */
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lg{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:1px solid var(--line);border-right:6px solid var(--c);background:#fff}
.sw{width:22px;height:22px;border-radius:6px;background:var(--c);flex:none}
.ficon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:7px}
.h{position:relative;height:60px;border-radius:12px;border:2px solid var(--c);background:linear-gradient(to top,var(--c) var(--p),#fff var(--p));padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.h span{background:rgba(255,255,255,.92);border-radius:6px;padding:0 5px;font-weight:700;font-size:13px}
.h small{font-size:10.5px;background:rgba(255,255,255,.85);border-radius:5px;padding:0 4px;margin-top:2px}
.h.al::after{content:'!';position:absolute;top:-6px;left:-6px;width:17px;height:17px;border-radius:50%;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.hint{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.sumst{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 18px}
.ent{background:#fff;border:1px solid var(--line);border-right:6px solid var(--c);border-radius:12px;padding:12px;cursor:pointer}

/* الفحوصات */
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.catb{border:1px solid #bae6fd;background:#fff;border-radius:99px;padding:6px 14px;font-size:13.5px;display:flex;gap:6px;align-items:center}
.catb b{background:#e0f2fe;color:#0369a1;border-radius:99px;padding:0 8px;font-size:12px}
.catb.on{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border-color:transparent}
.catb.on b{background:rgba(255,255,255,.25);color:#fff}
.catb.miss{border-color:#fcd34d;background:#fffbeb}
.catb.miss.on{background:linear-gradient(135deg,#f59e0b,#d97706)}
.tbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tbar input,.tbar select{width:auto;min-width:150px}
.ttable td{white-space:nowrap}
.ttable td.wrap{white-space:normal;min-width:140px}
.fcount{border:1px solid #bae6fd;background:#f0f9ff;color:#0369a1;border-radius:99px;padding:2px 10px;font-size:12.5px}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#f8fafc;font-size:13.5px}
.file .fi{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#e0f2fe;color:#0369a1;font-size:11px;font-weight:700;flex:none}
.file button.lnk{background:none;border:none;color:var(--brand);padding:0;text-align:right}
.catrow{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}

/* الجداول والنماذج */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
th{color:var(--muted);font-weight:600;background:#f0f9ff;white-space:nowrap}
tbody tr:hover{background:#f8fdff}
.tablewrap{overflow-x:auto}
.mrow{display:grid;gap:8px;align-items:center;grid-template-columns:2fr 1fr 1fr auto;margin-bottom:8px}
.srow{display:grid;gap:8px;align-items:center;grid-template-columns:2fr 1.4fr .8fr 1.6fr auto;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.srow.nopct{grid-template-columns:2fr 1.4fr .8fr auto}
.rng{display:flex;align-items:center;gap:8px}
.rng output{min-width:42px;font-weight:700;color:var(--brand);text-align:center}
.ctl{display:flex;gap:2px}
.ctl button{padding:4px 7px;background:#f0f9ff}
.hst{display:grid;grid-template-columns:1.6fr 2fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.tb{font-size:11.5px;padding:1px 8px;border-radius:99px;background:#f1f5f9;color:#475569;margin-right:6px;white-space:nowrap}
.tb.ok{background:#dcfce7;color:#15803d}
.tb.bad{background:#fee2e2;color:#b91c1c}
.stsel{width:auto;padding:3px 8px;border-radius:99px;border:none;font-size:13px}
.st-pending{background:#fef3c7;color:#b45309}
.st-pass{background:#dcfce7;color:#15803d}
.st-fail{background:#fee2e2;color:#b91c1c}
.foot{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.lday{font-weight:700;margin:14px 0 6px;color:#334155}
.lrow{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.lrow time{color:var(--muted);font-size:12.5px;min-width:46px}
.visit{border-bottom:1px solid var(--line);padding:10px 0}
.visit.open{border-right:4px solid var(--warn);padding-right:10px}
.banner{background:linear-gradient(135deg,#f0f9ff,#e0f2fe);border:1px solid #7dd3fc;border-radius:14px;padding:12px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* الدخول */
.authwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#bae6fd,#7dd3fc 45%,#38bdf8)}
.authbox{width:min(440px,100%);border:3px solid var(--gold);border-radius:20px;box-shadow:0 0 0 6px rgba(212,175,55,.22),0 25px 50px -20px rgba(3,105,161,.55);margin:0}
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:16px;flex-wrap:wrap}
.tab{background:none;border:none;padding:8px 14px;color:var(--muted);border-radius:10px}
.tab.on{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;font-weight:600}
.rolepick{display:flex;flex-direction:column;gap:8px}
.rolecard{flex-direction:row;align-items:flex-start;gap:10px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.rolecard:has(input:checked){border-color:var(--brand);background:#f0f9ff}
.rolecard input{margin-top:5px}

/* النوافذ */
.modal{position:fixed;inset:0;background:rgba(12,74,110,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:80}
.modal[hidden]{display:none}
.mbox{background:#fff;border-radius:18px;padding:18px;width:min(760px,100%);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.mh b{font-size:17px}
h4{margin:14px 0 8px}
.pick{display:flex;gap:12px;align-items:center;text-align:right;background:#fff;border:2px solid var(--line);padding:14px;width:100%;border-radius:14px}
.pick:hover{border-color:var(--brand);background:#f0f9ff}
.pick .ficon{width:46px;height:46px}

/* المهندس الذكي */
.ai{position:fixed;left:16px;bottom:16px;width:min(440px,calc(100vw - 32px));height:min(660px,calc(100vh - 32px));background:#fff;border-radius:20px;box-shadow:0 25px 60px -12px rgba(12,74,110,.55);display:flex;flex-direction:column;z-index:60;overflow:hidden;border:2px solid #7dd3fc}
.ai[hidden]{display:none}
.aih{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center}
.aih .x{color:#fff}
.aimsgs{flex:1;overflow:auto;padding:12px;background:#f0f9ff}
.msg{max-width:92%;padding:9px 13px;border-radius:14px;margin-bottom:9px;font-size:14px;line-height:1.7}
.msg.user{background:#0284c7;color:#fff;margin-right:auto;border-bottom-left-radius:4px;width:fit-content}
.msg.bot{background:#fff;border:1px solid var(--line);border-bottom-right-radius:4px}
.msg p{margin:0 0 4px}
.msg ul{margin:2px 0 6px;padding-right:18px}
.aichips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)}
.chip{border:1px solid #7dd3fc;background:#f0f9ff;color:#0369a1;border-radius:99px;padding:3px 11px;font-size:12.5px}
.aiform{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.typing{color:var(--muted);font-size:13px;padding:4px 8px}

.toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:12px;z-index:99;max-width:90vw;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.toast.err{background:var(--bad)}
.toast.ok{background:var(--ok)}
.spin{width:34px;height:34px;border:4px solid #bae6fd;border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:900px){
  .side{position:fixed;right:0;top:0;transform:translateX(105%);transition:transform .2s}
  body.sideopen .side{transform:none}
  body.sideopen .backdrop{display:block;position:fixed;inset:0;background:rgba(12,74,110,.45);z-index:65}
  .menu{display:inline-flex}
  main{padding:14px}
}
@media(max-width:700px){
  .grid2,.grid3{grid-template-columns:1fr}
  .mrow{grid-template-columns:1fr 1fr}
  .srow,.srow.nopct{grid-template-columns:1fr}
  .hst{grid-template-columns:1fr}
  .topbar h2{font-size:15px}
  .tbar input,.tbar select{flex:1}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" hidden><div class="mbox" id="mbody"></div></div>
<section id="ai" class="ai" hidden>
  <div class="aih">
    <div class="logo" style="width:36px;height:36px">✦</div>
    <div class="grow"><b>المهندس الذكي</b><div class="small" id="aimode"></div></div>
    <button type="button" class="x" data-act="ai-clear" title="مسح المحادثة">⟲</button>
    <button type="button" class="x" data-act="ai-close">✕</button>
  </div>
  <div class="aimsgs" id="aimsgs"></div>
  <div class="aichips">
    <button type="button" class="chip" data-act="ai-q" data-q="شنو الجديد اليوم؟">شنو الجديد اليوم؟</button>
    <button type="button" class="chip" data-act="ai-q" data-q="الفحوصات الناقصة">الفحوصات الناقصة</button>
    <button type="button" class="chip" data-act="ai-q" data-q="نسبة الإنجاز">نسبة الإنجاز</button>
    <button type="button" class="chip" data-act="ai-q" data-q="الفحوصات الراسبة">الفحوصات الراسبة</button>
    <button type="button" class="chip" data-act="ai-q" data-q="تقرير الأسبوع">تقرير الأسبوع</button>
  </div>
  <form class="aiform" id="aiform">
    <input name="q" placeholder="اسأل: شنو وضع منزل 45؟" autocomplete="off">
    <button class="primary">إرسال</button>
  </form>
</section>

/* ================= إعدادات الاتصال بـ Supabase ================= */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;

const wavgX = (items, val, w) => { const tot = items.reduce((a, x) => a + w(x), 0); return tot ? items.reduce((a, x) => a + val(x) * w(x), 0) / tot : 0; };
const clampP = v => Math.max(0, Math.min(100, +v || 0));
const fmtP = v => { const x = clampP(v); return Number.isInteger(x) ? String(x) : x.toFixed(2).replace(/0+$/, '').replace(/\.$/, ''); };
const wavg = (items, val, w) => { const tot = items.reduce((a, x) => a + w(x), 0); return tot ? Math.round(items.reduce((a, x) => a + val(x) * w(x), 0) / tot) : 0; };
const toLatin = s => String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const norm = s => toLatin(s).replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase();

const fsize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

/* ================= أدوات الاتصال ================= */
async function q(promise) {
  const { data, error } = await promise;
  if (error) throw error;
  return data;
}
async function fetchAll(make, max = 50000) {
  const out = [];
  for (let from = 0; from < max; from += 1000) {
    const rows = await q(make().range(from, from + 999));
    out.push(...rows);
    if (rows.length < 1000) break;
  }
  return out;
}
function errMsg(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'تعذر الاتصال بالخادم. تحقق من الإنترنت';
  if (/row-level security|permission denied|violates/i.test(m)) return 'ليس لديك صلاحية لهذا الإجراء';
  if (/JWT|token/i.test(m)) return 'انتهت الجلسة. سجّل الدخول من جديد';
  return m;
}
async function api(action, payload) {
  const { data } = await sb.auth.getSession();
  const token = data && data.session ? data.session.access_token : CONFIG.key;
  const res = await fetch(CONFIG.url + '/functions/v1/office-api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CONFIG.key, Authorization: 'Bearer ' + token },
    body: JSON.stringify(Object.assign({ action }, payload || {}))
  });
  let j = {};
  try { j = await res.json(); } catch (e) { j = {}; }
  if (!res.ok || j.error) throw new Error(j.error || ('HTTP ' + res.status));
  return j;
}
function setSync(busy) {
  const el = $('.sync');
  if (el) { el.classList.toggle('busy', busy); el.lastChild.textContent = busy ? ' جارٍ الحفظ…' : ' محفوظ'; }
}

function toast(msg, kind) {
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), kind === 'err' ? 4000 : 2800);
}

const toEmail = u => `${String(u).trim().toLowerCase()}@${EMAIL_DOMAIN}`;

async function doRegister(fd) {
  const name = (fd.get('name') || '').trim();
  const username = (fd.get('username') || '').trim().toLowerCase();
  const password = fd.get('password') || '';
  if (!name) return toast('اكتب الاسم الكامل', 'err');
  if (!/^[a-z0-9._-]{3,30}$/.test(username)) return toast('اسم المستخدم من 3 إلى 30 حرفاً إنكليزياً أو أرقاماً بدون مسافات', 'err');
  if (password.length < 6) return toast('كلمة المرور 6 أحرف على الأقل', 'err');
  const r = await api('register', { name, username, password, role: fd.get('role') || 'staff', company: (fd.get('company') || '').trim() });
  if (r.first) {
    const { error } = await sb.auth.signInWithPassword({ email: toEmail(username), password });
    if (error) throw error;
    return afterAuth();
  }
  S.authMode = 'login';
  render();
  toast('تم إرسال طلبك. لا يمكنك الدخول حتى يوافق المدير', 'ok');
}

async function doLogin(fd) {
  const username = (fd.get('username') || '').trim().toLowerCase();
  const { error } = await sb.auth.signInWithPassword({ email: toEmail(username), password: fd.get('password') || '' });
  if (error) return toast(/Invalid login/i.test(error.message) ? 'بيانات الدخول غير صحيحة' : errMsg(error), 'err');
  await afterAuth();
}

async function afterAuth() {
  const { data } = await sb.auth.getUser();
  const user = data && data.user;
  if (!user) { S.user = null; S.boot = false; return render(); }
  const prof = await q(sb.from('profiles').select('*').eq('id', user.id).maybeSingle());
  if (!prof || prof.status !== 'active') {
    await sb.auth.signOut();
    S.user = null; S.boot = false; render();
    return toast(prof && prof.status === 'pending' ? 'حسابك بانتظار موافقة المدير' : 'هذا الحساب موقوف. راجع المدير', 'err');
  }
  S.user = prof;
  await loadHome();
  const pid = localStorage.getItem(PID_KEY);
  S.boot = false;
  if (pid && S.projects.some(p => p.id === pid)) await enterProject(pid);
  else { S.view = 'home'; render(); }
}

/* ================= تحميل المشروع وحفظه ================= */
function normProject(p) {
  p.models = p.models || []; p.buildings = p.buildings || []; p.testCats = p.testCats || [];
  p.visits = p.visits || []; p.log = p.log || []; p.nextNo = p.nextNo || 1;
  p.testCats.forEach(c => { c.records = c.records || []; });
  p.models.forEach(m => { m.stages = m.stages || []; m.houses = m.houses || []; m.houses.forEach(h => { h.prog = h.prog || {}; }); });
  p.buildings.forEach(b => { b.stages = b.stages || []; });
}
const recFromRow = r => ({
  id: r.id, catId: r.cat_id, unitId: r.unit_id || '', unit: r.unit, date: r.test_date || '', sample: r.sample || '', lab: r.lab || '',
  result: r.result || '', status: r.status, notes: r.notes || '', files: r.files || [], by: r.by_name || '', createdBy: r.created_by, t: Date.parse(r.created_at)
});
const recToRow = (rec, pid) => ({
  id: rec.id, project_id: pid, cat_id: rec.catId, unit_id: rec.unitId || '', unit: rec.unit, test_date: rec.date || null,
  sample: rec.sample || '', lab: rec.lab || '', result: rec.result || '', status: rec.status, notes: rec.notes || '', files: rec.files || [], by_name: rec.by || ''
});
const visitFromRow = v => ({ id: v.id, date: v.visit_date || '', notes: v.notes, open: v.open, by: v.by_name || '', createdBy: v.created_by, t: Date.parse(v.created_at) });
const logFromRow = e => ({ t: Date.parse(e.t), by: e.by_name, role: e.role, kind: e.kind, unitId: e.unit_id, label: e.label, stage: e.stage, from: e.from_pct, to: e.to_pct, text: e.text });

async function loadProject(id) {
  const [row, recs, vis, logs] = await Promise.all([
    q(sb.from('projects').select('*').eq('id', id).maybeSingle()),
    fetchAll(() => sb.from('test_records').select('*').eq('project_id', id).order('created_at')),
    fetchAll(() => sb.from('visits').select('*').eq('project_id', id).order('created_at', { ascending: false })),
    fetchAll(() => sb.from('logs').select('*').eq('project_id', id).order('t', { ascending: false }), 4000)
  ]);
  if (!row) return null;
  const p = Object.assign({}, row.data || {}, { id: row.id, name: row.name, type: row.type, client: row.client, location: row.location, color: row.color, version: row.version });
  normProject(p);
  const byCat = {};
  p.testCats.forEach(c => { c.records = []; byCat[c.id] = c; });
  recs.forEach(r => { const c = byCat[r.cat_id]; if (c) c.records.push(recFromRow(r)); });
  p.visits = vis.map(visitFromRow);
  p.log = logs.map(logFromRow).reverse();
  return p;
}

async function reloadProject(quiet) {
  if (!S.p) return;
  try {
    const p = await loadProject(S.p.id);
    if (!p) { toast('تم حذف هذا المشروع', 'err'); return exitProject(); }
    S.p = p;
    S.stale = false;
    if (!quiet || $('#modal').hidden) { const y = window.scrollY; render(); window.scrollTo(0, y); }
  } catch (e) { toast(errMsg(e), 'err'); }
}

/* حفظ بنية المشروع (النماذج والمنازل والفقرات والأصناف) مع منع الكتابة فوق تعديلات غيرك */
async function saveDoc() {
  const p = S.p;
  const data = { models: p.models, buildings: p.buildings, testCats: p.testCats.map(c => ({ id: c.id, name: c.name })), nextNo: p.nextNo };
  S.lastWrite = Date.now();
  setSync(true);
  const { data: rows, error } = await sb.from('projects')
    .update({ name: p.name, type: p.type, client: p.client, location: p.location, color: p.color, data, progress: projectPct(p), version: p.version + 1, updated_at: new Date().toISOString(), updated_by: S.user.id })
    .eq('id', p.id).eq('version', p.version).select('version');
  setSync(false);
  if (error || !rows || !rows.length) {
    S.pendingLogs = [];
    await reloadProject();
    toast(error ? errMsg(error) : 'عدّل مستخدم آخر هذا المشروع قبل لحظات. تم تحميل آخر نسخة، أعد التعديل', 'err');
    return false;
  }
  p.version = rows[0].version;
  await flushLogs();
  return true;
}

/* ================= التحديث اللحظي ================= */
function subscribe(pid) {
  unsubscribe();
  const onChange = () => {
    if (Date.now() - S.lastWrite < 2500) return;
    clearTimeout(S.rtTimer);
    S.rtTimer = setTimeout(() => {
      if (!S.p || S.p.id !== pid) return;
      if (!$('#modal').hidden || S.busy) { S.stale = true; return; }
      reloadProject(true);
    }, 800);
  };
  S.channel = sb.channel('project-' + pid)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'projects', filter: `id=eq.${pid}` }, onChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'test_records', filter: `project_id=eq.${pid}` }, onChange)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'visits', filter: `project_id=eq.${pid}` }, onChange)
    .subscribe();
}
function unsubscribe() {
  if (S.channel) { try { sb.removeChannel(S.channel); } catch (e) { /* تجاهل */ } }
  S.channel = null;
}

/* ================= الوحدات والإنجاز ================= */
const curP = () => S.p;
const getM = (p, mid) => p && p.models.find(m => m.id === mid);

function units(p) {
  const out = [];
  if (p.type === 'complex') {
    p.models.forEach(m => m.houses.forEach(h => out.push({
      id: h.id, no: h.no, label: 'منزل ' + h.no, color: m.color, group: m.name, model: m, house: h, w: wt(h),
      stages: m.stages.map(s => ({ id: s.id, name: s.name, test: s.test, w: wt(s), pct: pct(h.prog[s.id]) }))
    })));
    out.sort((a, b) => a.no - b.no);
  }
  p.buildings.forEach(b => out.push({
    id: b.id, no: null, label: b.name, color: b.color, group: b.kind === 'infra' ? 'بنية تحتية' : '', building: b, w: wt(b),
    stages: b.stages.map(s => ({ id: s.id, name: s.name, test: s.test, w: wt(s), pct: pct(s.pct) }))
  }));
  return out;
}
const unitPct = u => wavg(u.stages, s => s.pct, wt);
const projectPct = p => +wavgX(units(p), u => wavgX(u.stages, s => s.pct, wt), wt).toFixed(2);
const housePct = (m, h) => wavg(m.stages, s => pct(h.prog[s.id]), wt);
const modelPct = m => +wavgX(m.houses, h => wavgX(m.stages, s => pct(h.prog[s.id]), wt), wt).toFixed(2);
const unitById = (p, id) => units(p).find(u => u.id === id);
const nosRange = m => { if (!m.houses.length) return '-'; const n = m.houses.map(h => h.no); return Math.min(...n) + ' – ' + Math.max(...n); };
function stageNames(p) {
  const names = [];
  p.models.forEach(m => m.stages.forEach(s => { if (!names.includes(s.name)) names.push(s.name); }));
  return names;
}

function matchUnit(p, txt) {
  const t = toLatin(String(txt || '').trim());
  if (!t) return null;
  const us = units(p);
  const u = us.find(x => x.label === t || x.label === t.replace(/^(بيت|دار|منزل)\s*/, 'منزل '));
  if (u) return u;
  if (p.type === 'complex') {
    const m = t.match(/\d+/);
    return m ? (us.find(x => x.no === +m[0]) || null) : null;
  }
  return us.find(x => norm(x.label) === norm(t)) || null;
}

const catName = (p, id) => { const c = p.testCats.find(x => x.id === id); return c ? c.name : ''; };
const hasTest = (p, unitId, catId) => { const c = p.testCats.find(x => x.id === catId); return !!c && c.records.some(r => r.unitId === unitId); };
const resolveCat = (p, key) => key ? ((p.testCats.find(c => c.name.includes(key)) || {}).id || '') : '';
const makeStages = (p, withPct) => DEFAULT_STAGES.map(([n, k]) => Object.assign({ id: uid(), name: n, test: resolveCat(p, k) }, withPct ? { pct: 0 } : {}));
const toLabel = l => l.startsWith('منزل') ? 'لل' + l : 'لـ' + l;
const doneText = (s, label) => s.name.startsWith('صب') ? `تم ${s.name} ${toLabel(label)}` : `اكتمل "${s.name}" في ${label}`;
const missingTest = (p, u, s) => !!(s.test && s.pct >= 100 && catName(p, s.test) && !hasTest(p, u.id, s.test));
const missingText = (p, u, s) => `${doneText(s, u.label)} ولم تتم إضافة أي فحوصات مختبرية (${catName(p, s.test)}) حتى الآن`;

function issuesFor(p, onlyIds) {
  const out = [];
  const set = onlyIds ? new Set(onlyIds) : null;
  units(p).forEach(u => {
    if (set && !set.has(u.id)) return;
    u.stages.forEach(s => { if (missingTest(p, u, s)) out.push({ unitId: u.id, unit: u.label, stage: s.name, catId: s.test, text: missingText(p, u, s) }); });
  });
  return out;
}

function setStagePct(p, u, stageId, val) {
  val = pct(val);
  if (u.house) {
    const old = pct(u.house.prog[stageId]);
    if (old === val) return false;
    if (val) u.house.prog[stageId] = val; else delete u.house.prog[stageId];
    const s = u.model.stages.find(x => x.id === stageId);
    logP(p, { kind: 'prog', unitId: u.id, label: u.label, stage: s ? s.name : '', from: old, to: val });
    return true;
  }
  const s = u.building.stages.find(x => x.id === stageId);
  if (!s) return false;
  const old = pct(s.pct);
  if (old === val) return false;
  s.pct = val;
  logP(p, { kind: 'prog', unitId: u.id, label: u.label, stage: s.name, from: old, to: val });
  return true;
}

function updRemain(f) {
  const box = f && f.querySelector('#remain');
  if (!box) return;
  const total = +(f.querySelector('[name=total]').value) || 0;
  if (!total) { box.innerHTML = ''; return; }
  const used = [...f.querySelectorAll('[name=mcount]')].reduce((a, i) => a + (+i.value || 0), 0);
  const rem = total - used;
  box.innerHTML = rem >= 0
    ? `المدخل ${used} من ${total} — المتبقي <b>${rem}</b>${rem > 0 ? ' (سيُضاف تلقائياً كنموذج "باقي الوحدات")' : ''}`
    : `<span style="color:var(--bad)">المدخل ${used} أكبر من الإجمالي بمقدار ${-rem}</span>`;
}

function siteComplex(p) {
  const f = S.filter;
  const us = units(p).filter(u => u.house);
  const extras = units(p).filter(u => u.building);
  const issueIds = new Set(issuesFor(p).map(a => a.unitId));
  const area = p.models.reduce((a, m) => a + m.houses.length * (+m.area || 0), 0);
  const qq = toLatin(f.q).trim();
  const tiles = us.filter(u => {
    const v = unitPct(u);
    if (f.model !== 'all' && u.model.id !== f.model) return false;
    if (qq && !String(u.no).includes(qq)) return false;
    if (f.st === 'none') return v === 0;
    if (f.st === 'prog') return v > 0 && v < 100;
    if (f.st === 'done') return v >= 100;
    if (f.st === 'missing') return issueIds.has(u.id);
    return true;
  }).map(u => {
    const v = unitPct(u);
    return `<button type="button" class="h ${issueIds.has(u.id) ? 'al' : ''}" style="--c:${u.color};--p:${v}%" data-act="house" data-id="${u.id}" title="منزل ${u.no} — ${esc(u.group)} — ${v}%"><span>${u.no}</span><small>${v}%</small></button>`;
  }).join('');
  const legend = p.models.map(m => `<div class="lg" style="--c:${m.color}"><span class="sw"></span>
      <div class="grow"><b>${esc(m.name)}</b><div class="small muted">${m.houses.length} منزل · ${m.area || '-'} م² · ${modelPct(m)}%</div></div>
      ${isAdmin() ? `<button type="button" class="ghost sm" data-act="edit-model" data-m="${m.id}">تعديل</button>` : ''}</div>`).join('');
  const stageSum = stageNames(p).map(name => {
    const hits = us.map(u => ({ s: u.stages.find(s => s.name === name), w: u.w })).filter(x => x.s);
    const sw = p.models.flatMap(m => m.stages).find(s => s.name === name);

      <div class="row" style="margin-bottom:12px">

/* ================= صفحة الفحوصات ================= */
function viewTests(p) {
  const f = S.tf;
  const all = p.testCats.flatMap(c => c.records.map(r => ({ r, c })));
  const miss = issuesFor(p);
  if (f.cat !== 'all' && f.cat !== 'missing' && !p.testCats.some(c => c.id === f.cat)) f.cat = 'all';
  const cnt = st => all.filter(x => x.r.status === st).length;
  const chips = `<div class="cats">
      <button type="button" class="catb ${f.cat === 'all' ? 'on' : ''}" data-act="tcat" data-c="all">كل الفحوصات <b>${all.length}</b></button>
      ${p.testCats.map(c => `<button type="button" class="catb ${f.cat === c.id ? 'on' : ''}" data-act="tcat" data-c="${c.id}">${esc(c.name)} <b>${c.records.length}</b></button>`).join('')}
      <button type="button" class="catb miss ${f.cat === 'missing' ? 'on' : ''}" data-act="tcat" data-c="missing">مطلوبة ولم تُسجَّل <b>${miss.length}</b></button>
    </div>`;
  const toolbar = f.cat === 'missing' ? '' : `<div class="tbar">
      <input placeholder="بحث: وحدة، عينة، مختبر، نتيجة" value="${esc(f.q)}" data-tfilter="q">
      <select data-tfilter="st"><option value="all">كل الحالات</option>${Object.entries(STATUS).map(([k, l]) => `<option value="${k}" ${f.st === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <span class="grow"></span>
      ${can('tests') ? `<button type="button" class="primary" data-act="rec-new" data-cat="${f.cat !== 'all' ? f.cat : ''}">+ تسجيل فحص</button>` : ''}
    </div>`;
  let body;
  if (f.cat === 'missing') {
    body = miss.length ? `<div class="tablewrap"><table class="ttable"><thead><tr><th>الوحدة</th><th>الفقرة المكتملة</th><th>الفحص المطلوب</th><th></th></tr></thead><tbody>
      ${miss.map(m => `<tr><td><b>${esc(m.unit)}</b></td><td>${esc(m.stage)}</td><td><span class="tb bad">${esc(catName(p, m.catId))}</span></td>
        <td>${can('tests') ? `<button type="button" class="primary sm" data-act="rec-new" data-cat="${m.catId}" data-unit="${esc(m.unit)}">تسجيل الفحص</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">كل الفقرات المكتملة التي تتطلب فحوصات لها فحوصات مسجلة.</div>';
  } else {
    const qq = norm(f.q).trim();
    const list = all.filter(({ r, c }) => (f.cat === 'all' || c.id === f.cat) && (f.st === 'all' || r.status === f.st)
      && (!qq || norm([r.unit, r.sample, r.lab, r.result, r.notes, c.name].join(' ')).includes(qq)))
      .sort((a, b) => (b.r.date || '').localeCompare(a.r.date || '') || b.r.t - a.r.t);
    body = list.length ? `<div class="tablewrap"><table class="ttable"><thead><tr>
        <th>التاريخ</th>${f.cat === 'all' ? '<th>الصنف</th>' : ''}<th>الوحدة / الزون</th><th>رقم العينة</th><th>المختبر</th><th>النتيجة</th><th>الحالة</th><th>المرفقات</th><th>بواسطة</th><th></th>
      </tr></thead><tbody>
      ${list.map(({ r, c }) => `<tr>
        <td>${esc(r.date) || '—'}</td>${f.cat === 'all' ? `<td>${esc(c.name)}</td>` : ''}
        <td><b>${esc(r.unit)}</b>${r.unitId ? '' : ' <span class="tb">زون</span>'}</td>
        <td>${esc(r.sample) || '—'}</td><td>${esc(r.lab) || '—'}</td><td class="wrap">${esc(r.result) || '—'}</td>
        <td>${can('tests') ? `<select class="stsel st-${r.status}" data-chg="rec" data-c="${c.id}" data-id="${r.id}">${Object.entries(STATUS).map(([k, l]) => `<option value="${k}" ${r.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select>`
          : `<span class="stsel st-${r.status}">${STATUS[r.status]}</span>`}</td>
        <td>${r.files.length ? `<button type="button" class="fcount" data-act="rec-open" data-c="${c.id}" data-id="${r.id}">📎 ${r.files.length}</button>` : '<span class="muted">—</span>'}</td>
        <td class="small muted">${esc(r.by)}</td>
        <td style="white-space:nowrap"><button type="button" class="ghost sm" data-act="rec-open" data-c="${c.id}" data-id="${r.id}">${can('tests') ? 'تعديل' : 'عرض'}</button>
          ${can('tests') ? `<button type="button" class="x" data-act="rec-del" data-c="${c.id}" data-id="${r.id}">✕</button>` : ''}</td>
      </tr>`).join('')}</tbody></table></div>` : '<div class="empty">لا توجد فحوصات مطابقة</div>';
  }
  return `<div class="tiles">
      <div class="tile t1">كل الفحوصات<b>${all.length}</b></div>
      <div class="tile t2">ناجحة<b>${cnt('pass')}</b></div>
      <div class="tile t4">راسبة<b>${cnt('fail')}</b></div>
      <div class="tile t3">قيد الفحص<b>${cnt('pending')}</b></div>
      <div class="tile t5">مطلوبة ولم تُسجَّل<b>${miss.length}</b></div>
    </div>
    <div class="card">
      <div class="row" style="margin-bottom:10px"><h3>سجل الفحوصات</h3><span class="grow"></span>
        ${can('tests') ? '<button type="button" class="ghost sm" data-act="cats">إدارة الأصناف</button>' : ''}</div>
      ${chips}${toolbar}${body}
    </div>`;
}

function logList(entries) {
  if (!entries.length) return '<div class="empty">لا يوجد نشاط مسجل</div>';
  let h = '', day = '';
  entries.forEach(e => {
    const k = dkey(e.t);
    if (k !== day) { day = k; h += `<div class="lday">${k === dkey(Date.now()) ? 'اليوم' : k === dkey(Date.now() - DAY) ? 'أمس' : k}</div>`; }
    h += `<div class="lrow"><time>${hhmm(e.t)}</time><div class="grow">${esc(logText(e))}</div><span class="small muted">${esc(e.by || '')}</span></div>`;
  });
  return h;
}

/* ================= الرسم ================= */
function render() {
  const app = $('#app');
  document.body.classList.remove('sideopen');
  if (!configured) { app.innerHTML = viewConfig(); return; }
  if (S.boot) { app.innerHTML = viewLoading(); return; }
  if (!S.user) { app.innerHTML = viewAuth(); return; }
  const p = S.p;
  if (!p) {
    if (S.view === 'users' && !isAdmin()) S.view = 'home';
    if (!['home', 'users', 'settings'].includes(S.view)) S.view = 'home';
    app.innerHTML = outerLayout(S.view === 'users' ? viewUsers() : S.view === 'settings' ? viewSettings() : viewHome());
    return;
  }
  const sec = SECTIONS(p).find(x => x[0] === S.view) || SECTIONS(p)[0];
  S.view = sec[0];
  const views = { dash: viewPDash, site: viewSite, tests: viewTests, visits: viewVisits, log: x => `<div class="card">${logList(x.log.slice(-300).reverse())}</div>` };
  app.innerHTML = projectLayout(p, sec[1], views[S.view](p));
}

function houseForm(p, u) {

      <td><button type="button" class="fcount" data-act="rec-open" data-c="${t.c.id}" data-id="${t.r.id}">${t.r.files.length ? '📎 ' + t.r.files.length : 'عرض'}</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="muted small">لم تُسجل أي فحوصات لهذا المنزل بعد.</div>'}

      <label>إلى منزل رقم<input name="to" type="number" value="${nos.length ? Math.max(...nos) : ''}" required></label></div>
    <label>النسبة<div class="rng"><input type="range" name="val" min="0" max="100" step="5" value="100"><output>100%</output></div></label>

/* ================= المهندس الذكي ================= */
function findBuilding(p, t) {
  if (p.type === 'complex') return null;
  const list = units(p).map(u => ({ u, n: norm(u.label) })).sort((a, b) => b.n.length - a.n.length);
  const hit = list.find(x => { const i = t.indexOf(x.n); return i >= 0 && !/\d/.test(t.charAt(i + x.n.length)); });
  return hit ? hit.u : null;
}
const findModel = (p, t) => p.models.slice().sort((a, b) => b.name.length - a.name.length).find(m => t.includes(norm(m.name))) || null;

function unitDetail(p, u) {
  const out = [`**${u.label}**${u.group ? ' — ' + u.group : ''}`, `نسبة الإنجاز: **${unitPct(u)}%**`];
  if (u.model && u.model.area) out.push(`المساحة: ${u.model.area} م²`);
  out.push('الفقرات:');
  u.stages.forEach(s => out.push(`- ${s.name}: ${s.pct}%${s.pct >= 100 ? ' ✔' : ''}${s.test ? (hasTest(p, u.id, s.test) ? ' — ' + catName(p, s.test) + ': مسجّلة' : s.pct >= 100 ? ' — ⚠ لم تُسجَّل ' + catName(p, s.test) : '') : ''}`));
  const tests = p.testCats.flatMap(c => c.records.filter(r => r.unitId === u.id).map(r => `- ${c.name}: ${STATUS[r.status]}${r.result ? ' (' + r.result + ')' : ''} — ${r.date}${r.files.length ? ' — ' + r.files.length + ' ملف' : ''}`));
  out.push(tests.length ? 'الفحوصات المختبرية:' : 'لم تُسجَّل أي فحوصات مختبرية لهذه الوحدة حتى الآن.');
  tests.forEach(x => out.push(x));
  const note = u.house ? u.house.note : u.building.note;
  if (note) out.push('ملاحظة: ' + note);
  const last = p.log.filter(e => e.unitId === u.id && e.kind === 'prog').slice(-5).reverse();
  if (last.length) { out.push('آخر التحديثات:'); last.forEach(e => out.push(`- ${dkey(e.t)} ${hhmm(e.t)}: ${e.stage} من ${e.from}% إلى ${e.to}% (${e.by})`)); }
  return out.join('\n');
}

function rangeReport(p, from, to, title) {
  const inR = ts => { const k = dkey(ts || 0); return k >= from && k <= to; };
  const out = [`**تقرير ${title} — ${p.name}** (${from === to ? from : from + ' إلى ' + to})`, `الإنجاز الكلي الآن: ${projectPct(p)}%`];
  const L = p.log.filter(e => inR(e.t));
  const tests = p.testCats.flatMap(c => c.records.filter(r => inR(r.t)).map(r => Object.assign({ cat: c.name }, r)));
  const vis = p.visits.filter(v => inR(v.t));
  if (!L.length && !tests.length && !vis.length) { out.push('', 'لا توجد أي تحديثات مسجلة في هذه الفترة.'); return out.join('\n'); }
  const prog = L.filter(e => e.kind === 'prog');
  const done = prog.filter(e => e.to >= 100 && e.from < 100);
  if (done.length) {
    out.push('', `فقرات اكتملت (${done.length}):`);
    done.slice(0, 30).forEach(e => out.push(`- ${e.label}: ${e.stage} ✔ (${e.by})`));
    if (done.length > 30) out.push(`- و${done.length - 30} فقرة أخرى`);
  }
  const other = prog.filter(e => !(e.to >= 100 && e.from < 100));
  if (other.length) {
    out.push('', `تحديثات نسب الإنجاز (${other.length}):`);
    other.slice(-15).reverse().forEach(e => out.push(`- ${e.label}: ${e.stage} من ${e.from}% إلى ${e.to}% (${e.by})`));
    if (other.length > 15) out.push(`- و${other.length - 15} تحديث آخر`);
  }
  if (tests.length) {
    out.push('', `فحوصات مختبرية مضافة (${tests.length}):`);
    tests.forEach(r => out.push(`- ${r.cat} — ${r.unit}: ${STATUS[r.status]}${r.result ? ' (' + r.result + ')' : ''}${r.by ? ' — ' + r.by : ''}`));
  }
  const misc = L.filter(e => e.kind !== 'prog' && e.kind !== 'test');
  if (misc.length) { out.push('', 'أحداث أخرى:'); misc.slice(-10).forEach(e => out.push(`- ${logText(e)} (${e.by})`)); }
  if (vis.length) { out.push('', 'زيارات وملاحظات:'); vis.forEach(v => out.push(`- ${v.notes}${v.open ? ' [متابعة مفتوحة]' : ''} (${v.by || ''})`)); }
  const miss = issuesFor(p, [...new Set(done.map(e => e.unitId))]);
  if (miss.length) { out.push('', 'فقرات اكتملت بدون فحوصات مختبرية:'); miss.slice(0, 20).forEach(a => out.push('- ' + a.text)); if (miss.length > 20) out.push(`- و${miss.length - 20} أخرى`); }
  return out.join('\n');
}

function missingReport(p) {
  const all = issuesFor(p);
  if (!all.length) return 'كل الفقرات المكتملة التي تتطلب فحوصات لها فحوصات مسجلة.';
  return [`**فقرات مكتملة بدون فحوصات مختبرية (${all.length})**`].concat(all.slice(0, 60).map(a => '- ' + a.text), all.length > 60 ? [`- و${all.length - 60} أخرى`] : []).join('\n');
}
function failedReport(p) {
  const out = ['**الفحوصات الراسبة**'];
  p.testCats.forEach(c => c.records.filter(r => r.status === 'fail').forEach(r => out.push(`- ${c.name} — ${r.unit}: ${r.result || 'بدون نتيجة مسجلة'} (${r.date})${r.notes ? ' — ' + r.notes : ''}`)));
  return out.length > 1 ? out.join('\n') : 'لا توجد فحوصات راسبة في هذا المشروع.';
}
function pendingReport(p) {
  const rs = [];
  p.testCats.forEach(c => c.records.filter(r => r.status === 'pending').forEach(r => rs.push(`- ${c.name} — ${r.unit} (${r.date || '—'}${r.date ? '، منذ ' + daysSince(r.date) + ' يوم' : ''})`)));
  return rs.length ? [`**فحوصات قيد الفحص (${rs.length})**`].concat(rs).join('\n') : 'لا توجد فحوصات قيد الفحص.';
}
function progressReport(p) {
  const out = [`**نسبة إنجاز ${p.name}: ${projectPct(p)}%**`];
  const us = units(p);
  if (p.type === 'complex') p.models.forEach(m => out.push(`- ${m.name} (${m.houses.length} منزل): ${modelPct(m)}%`));
  else us.forEach(u => out.push(`- ${u.label}: ${unitPct(u)}%`));
  out.push(`مكتمل ${us.filter(u => unitPct(u) >= 100).length} · قيد التنفيذ ${us.filter(u => unitPct(u) > 0 && unitPct(u) < 100).length} · لم يبدأ ${us.filter(u => unitPct(u) === 0).length}`);
  return out.join('\n');
}
function modelReport(p, m) {
  const us = units(p).filter(u => u.model === m);
  const out = [`**${m.name}** — ${m.houses.length} منزل (أرقام ${nosRange(m)})، مساحة ${m.area || '-'} م²`, `الإنجاز: **${modelPct(m)}%**`, 'الفقرات:'];
  m.stages.forEach(s => { const v = us.map(u => pct(u.house.prog[s.id])); out.push(`- ${s.name}: ${avg(v)}% (${v.filter(x => x >= 100).length} منزل مكتمل)`); });
  return out.join('\n');
}
function testsReport(p) {
  const out = [`**ملخص الفحوصات — ${p.name}**`];
  p.testCats.forEach(c => out.push(`- ${c.name}: ${c.records.length} فحص (ناجح ${c.records.filter(r => r.status === 'pass').length}، راسب ${c.records.filter(r => r.status === 'fail').length}، قيد الفحص ${c.records.filter(r => r.status === 'pending').length})`));
  return out.join('\n');
}
const projectReport = p => [progressReport(p), '', testsReport(p), '', `زيارات متابعة مفتوحة: ${p.visits.filter(v => v.open).length}`].join('\n');

function helpText(p) {
  return [`اسألني عن مشروع **${p.name}**، مثلاً:`,
    '- شنو الجديد اليوم؟ / تقرير أمس / تقرير الأسبوع',
    p.type === 'complex' ? '- منزل 45' : '- اسم البناية (مثلاً: بناية 1)',
    p.type === 'complex' ? '- اسم نموذج' : '',
    '- نسبة الإنجاز / الفحوصات / الفحوصات الراسبة / الفحوصات الناقصة / قيد الفحص'].filter(Boolean).join('\n');
}

function aiLocal(qs, p) {
  const t = norm(qs);
  if (p.type === 'complex') {
    const m = t.match(/(?:منزل|بيت|دار|وحده|رقم)\s*(\d+)/) || t.match(/^\s*(\d+)\s*$/);
    if (m) { const u = units(p).find(x => x.no === +m[1]); return u ? unitDetail(p, u) : `لا يوجد منزل برقم ${m[1]} في هذا المشروع.`; }
  }
  const b = findBuilding(p, t);
  if (b) return unitDetail(p, b);
  if (/راسب|فشل|فاشل|مرفوض/.test(t)) return failedReport(p);
  if (/ناقص|نواقص|بدون فحص|ماكو فحص|لم يتم|تنبيه|مشاكل/.test(t)) return missingReport(p);
  if (/قيد الفحص|معلق|متاخر|انتظار/.test(t)) return pendingReport(p);
  if (/امس|البارحه/.test(t)) { const k = dkey(Date.now() - DAY); return rangeReport(p, k, k, 'أمس'); }
  if (/اسبوع/.test(t)) return rangeReport(p, dkey(Date.now() - 6 * DAY), dkey(Date.now()), 'آخر 7 أيام');
  if (/جديد|اليوم|صار|حصل/.test(t)) { const k = dkey(Date.now()); return rangeReport(p, k, k, 'اليوم'); }
  const m = findModel(p, t);
  if (m) return modelReport(p, m);
  if (/نسبه|انجاز|تقدم/.test(t)) return progressReport(p);
  if (/فحص|فحوصات|مختبر/.test(t)) return testsReport(p);
  if (/مشروع|ملخص|وضع|تقرير/.test(t)) return projectReport(p);
  return 'لم أفهم السؤال.\n\n' + helpText(p);
}

function aiContext(p) {
  const L = [`التاريخ اليوم: ${dkey(Date.now())}`, `المستخدم: ${S.user.name} (${ROLES[S.user.role]})`,
    `## المشروع: ${p.name} | النوع: ${TYPE_LABEL[p.type]} | الجهة: ${p.client || '-'} | الموقع: ${p.location || '-'} | الإنجاز الكلي: ${projectPct(p)}%`];
  if (p.type === 'complex') {
    p.models.forEach(m => {
      L.push(`نموذج "${m.name}" | مساحة ${m.area || '-'} م² | ${m.houses.length} منزل (أرقام ${nosRange(m)}) | إنجاز ${modelPct(m)}% | الفقرات بالترتيب: ${m.stages.map(s => s.name + (s.test ? ' [تتطلب ' + catName(p, s.test) + ']' : '')).join('، ')}`);
      let idle = 0;
      m.houses.forEach(h => {
        const parts = m.stages.filter(s => pct(h.prog[s.id]) > 0).map(s => `${s.name} ${pct(h.prog[s.id])}%`);
        if (parts.length || h.note) L.push(`- منزل ${h.no}: ${parts.join('، ') || 'لم يبدأ'}${h.note ? ' | ملاحظة: ' + h.note : ''}`);
        else idle++;
      });
      if (idle) L.push(`- (${idle} منزل من هذا النموذج لم يبدأ العمل فيها)`);
    });
  } else {
    p.buildings.forEach(b => L.push(`- ${b.name}: ${b.stages.map(s => `${s.name} ${pct(s.pct)}%${s.test ? ' [تتطلب ' + catName(p, s.test) + ']' : ''}`).join('، ')}${b.note ? ' | ملاحظة: ' + b.note : ''}`));
  }
  p.testCats.forEach(c => {
    L.push(`${c.name}: ${c.records.length} فحص`);
    c.records.slice(-200).forEach(r => L.push(`- ${r.date} | ${r.unit} | عينة ${r.sample || '-'} | مختبر ${r.lab || '-'} | نتيجة ${r.result || '-'} | ${STATUS[r.status]} | ${r.notes || ''} | ملفات ${r.files.length} | أضافه ${r.by || '-'} في ${dkey(r.t || 0)}`));
  });
  const miss = issuesFor(p);
  L.push(`فقرات مكتملة بدون الفحص المطلوب (${miss.length}):`);
  miss.slice(0, 150).forEach(a => L.push('- ' + a.text));
  if (p.visits.length) { L.push('الزيارات والملاحظات:'); p.visits.slice(0, 40).forEach(v => L.push(`- ${v.date} ${v.open ? '(متابعة مفتوحة)' : '(مغلقة)'} ${v.by || ''}: ${v.notes}`)); }
  const lg = p.log.slice(-250);
  if (lg.length) { L.push('سجل النشاط الأخير:'); lg.forEach(e => L.push(`- ${dkey(e.t)} ${hhmm(e.t)} | ${e.by}: ${logText(e)}`)); }
  let s = L.join('\n');
  if (s.length > 200000) s = s.slice(0, 200000) + '\n…(تم اختصار البيانات)';
  return s;
}

async function aiAsk(qs) {
  qs = String(qs || '').trim();
  const p = S.p;
  if (!qs || S.aiBusy) return;
  openAI(true);
  const history = S.chat.map(m => ({ role: m.role === 'user' ? 'user' : 'model', text: m.raw }));
  S.chat.push({ role: 'user', raw: qs });
  saveChatMsg('user', qs, p ? p.id : null);
  S.aiBusy = true;
  renderChat();
  let ans;
  if (S.office.ai_enabled) {
    try {
      const body = p ? { question: qs, history, context: aiContext(p) } : { question: qs, history, context: await aiContextAll(), scope: 'all' };
      ans = (await api('ai', body)).text;
    } catch (e) {
      ans = (p ? aiLocal(qs, p) : aiLocalAll()) + `\n\n(تعذّر الاتصال بـ Gemini [${errMsg(e)}]، والرد أعلاه من المحرك المدمج.)`;
    }
  } else {
    ans = p ? aiLocal(qs, p) : aiLocalAll();
  }
  S.aiBusy = false;
  saveChatMsg('ai', ans, p ? p.id : null);
  if (S.p !== p) return;
  S.chat.push({ role: 'ai', raw: ans });
  renderChat();
}

/* ملخص كل المشاريع للمهندس الذكي (يُستخدم من لوحة المشاريع قبل الدخول لأي مشروع) */
async function aiContextAll() {
  const L = [`التاريخ اليوم: ${dkey(Date.now())}`, `المستخدم: ${S.user.name} (${ROLES[S.user.role]})`, `عدد المشاريع: ${S.projects.length}`];
  for (const row of S.projects) {
    const p = await loadProject(row.id);
    if (!p) continue;
    const us = units(p);
    const tests = p.testCats.flatMap(c => c.records);
    const fails = tests.filter(r => r.status === 'fail').length;
    const open = p.visits.filter(v => v.open).length;
    L.push(`\n## المشروع: ${p.name} | النوع: ${TYPE_LABEL[p.type]} | الجهة: ${p.client || '-'} | الموقع: ${p.location || '-'} | الإنجاز الكلي: ${projectPct(p)}%`);
    if (p.type === 'complex') {
      p.models.forEach(m => L.push(`- نموذج "${m.name}": ${m.houses.length} منزل | إنجاز ${modelPct(m)}%`));
    } else {
      us.filter(u => u.building && u.building.kind !== 'infra').forEach(u => L.push(`- ${u.label}: ${unitPct(u)}%`));
    }
    const extras = us.filter(u => u.building && (u.building.kind === 'infra' || p.type === 'complex'));
    if (extras.length) L.push(`- بنى تحتية ومباني إضافية: ${extras.map(u => `${u.label} ${unitPct(u)}%`).join('، ')}`);
    L.push(`- الفحوصات: ${tests.length} (راسبة ${fails}) | فحوصات ناقصة لفقرات مكتملة: ${issuesFor(p).length} | زيارات مفتوحة: ${open}`);
  }
  return L.join('\n');
}

}

function md(s) {
  const fmt = x => esc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  let h = '', inList = false;
  String(s).split('\n').forEach(ln => {
    if (/^\s*[-•*]\s+/.test(ln)) {
      if (!inList) { h += '<ul>'; inList = true; }
      h += '<li>' + fmt(ln.replace(/^\s*[-•*]\s+/, '')) + '</li>';
      return;
    }
    if (inList) { h += '</ul>'; inList = false; }
    if (/^\s*#+\s/.test(ln)) h += '<p><b>' + fmt(ln.replace(/^\s*#+\s*/, '')) + '</b></p>';
    else if (ln.trim()) h += '<p>' + fmt(ln) + '</p>';
  });
  if (inList) h += '</ul>';
  return h;
}

/* ================= ملفات الفحوصات ================= */
async function uploadFiles(pid, recId, fileList) {
  const out = [];
  for (const file of fileList) {
    if (file.size > MAX_FILE) { toast(`الملف "${file.name}" أكبر من 20MB ولم يُرفع`, 'err'); continue; }
    const path = `${pid}/${recId}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.${fext(file.name)}`;
    const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || 'application/octet-stream', upsert: false });
    if (error) { toast(`تعذر رفع "${file.name}": ${errMsg(error)}`, 'err'); continue; }
    out.push({ path, name: file.name, size: file.size, type: file.type || '' });
  }
  return out;
}
async function removeFiles(paths) {
  if (!paths.length) return;
  const { error } = await sb.storage.from(BUCKET).remove(paths);
  if (error) console.warn('remove files', error);
}
function findRec(p, cid, id) {
  const c = p.testCats.find(x => x.id === cid);
  return c ? { c, r: c.records.find(x => x.id === id) } : { c: null, r: null };
}

/* ================= الإجراءات ================= */
function moveRow(el, dir) {
  const r = el.closest('.srow');
  if (!r) return;
  if (dir < 0 && r.previousElementSibling) r.parentNode.insertBefore(r, r.previousElementSibling);
  if (dir > 0 && r.nextElementSibling) r.parentNode.insertBefore(r.nextElementSibling, r);
}
function readStageRows(form) {

    w: (() => { const el = r.querySelector('[data-k=w]'); const v = el ? parseFloat(el.value) : 1; return isNaN(v) || v < 0 ? 1 : v; })(),
    pct: r.querySelector('[data-k=pct]') ? pct(r.querySelector('[data-k=pct]').value) : 0
  }));
}

/* تحويل إدخال مثل "45-50, 60" إلى قائمة وحدات (الفاصلة تفصل، والنطاق للمنازل فقط) */
function expandUnits(p, raw) {
  const parts = String(raw).split(/[,،;\n]+/).map(s => s.trim()).filter(Boolean);
  const out = [];
  for (const part of parts) {
    const m = toLatin(part).match(/^(\d+)\s*-\s*(\d+)$/);
    if (m && p.type === 'complex') {
      let a = +m[1], z = +m[2];
      if (a > z) [a, z] = [z, a];
      if (z - a > 1000) return null;
      for (let i = a; i <= z; i++) out.push(String(i));
    } else out.push(part);
  }
  return [...new Set(out)];
}

/* حفظ فحص واحد لعدة وحدات: سجل مستقل لكل وحدة، والملفات تُرفع لكل سجل */
async function saveManyRecs(p, c, fd, list, newFiles) {
  const found = list.map(t => ({ t, u: matchUnit(p, t) }));
  const missing = found.filter(x => !x.u).map(x => x.t);
  if (missing.length) return toast('وحدات غير موجودة: ' + missing.join('، '), 'err');
  const common = {
    catId: c.id, date: fd.get('date') || '', sample: (fd.get('sample') || '').trim(), lab: (fd.get('lab') || '').trim(),
    result: (fd.get('result') || '').trim(), status: fd.get('status') || 'pending', notes: (fd.get('notes') || '').trim()
  };
  S.lastWrite = Date.now();
  setSync(true);
  let done = 0;
  try {
    for (const { u } of found) {
      const rec = Object.assign({ id: uuid(), files: [], by: S.user.name, createdBy: S.user.id, t: Date.now() }, common, { unitId: u.id, unit: u.label });
      if (newFiles.length) rec.files = await uploadFiles(p.id, rec.id, newFiles);
      const row = await q(sb.from('test_records').insert(Object.assign(recToRow(rec, p.id), { created_by: S.user.id })).select('created_at').single());
      rec.t = Date.parse(row.created_at);
      c.records.push(rec);
      done++;
    }
  } finally { setSync(false); }
  logP(p, { kind: 'test', text: `أضاف ${c.name} لـ ${done} وحدة: ${found.map(x => x.u.label).join('، ')}` });
  await flushLogs();
  closeModal(); render();
  toast(`تم حفظ الفحص لـ ${done} وحدة`, 'ok');
}

    openModal('أصناف الفحوصات', catsForm(S.p));
    render();
  },
  'rec-new': d => {
    if (!need('tests')) return;
    if (!S.p.testCats.length) return toast('أضف صنف فحص أولاً من "إدارة الأصناف"', 'err');
    openModal('تسجيل فحص', recForm(S.p, null, { cat: d.cat || (S.tf.cat !== 'all' && S.tf.cat !== 'missing' ? S.tf.cat : ''), unit: d.unit || '' }));
  },
  'rec-open': d => {
    const { r } = findRec(S.p, d.c, d.id);
    if (r) openModal(`فحص — ${r.unit}`, recForm(S.p, r));
  },
  'rec-del': async d => {
    if (!need('tests')) return;
    const p = S.p;
    const { c, r } = findRec(p, d.c, d.id);
    if (!r || !confirm(`حذف ${c.name} ${toLabel(r.unit)}${r.files.length ? ' مع ' + r.files.length + ' ملف' : ''}؟`)) return;
    S.lastWrite = Date.now();
    await q(sb.from('test_records').delete().eq('id', r.id));
    await removeFiles(r.files.map(f => f.path));
    c.records = c.records.filter(x => x.id !== r.id);
    logP(p, { kind: 'other', unitId: r.unitId, text: `حذف ${c.name} ${toLabel(r.unit)}` });
    await flushLogs();
    render();
  },
  'file-open': async d => {
    const w = window.open('', '_blank');
    try {
      const { data, error } = await sb.storage.from(BUCKET).createSignedUrl(d.path, 600);
      if (error) throw error;
      if (w) w.location = data.signedUrl; else window.location.href = data.signedUrl;
    } catch (e) { if (w) w.close(); toast(errMsg(e), 'err'); }
  },

  'toggle-visit': async d => {
    if (!need('visits')) return;
    const p = S.p;
    const v = p.visits.find(x => x.id === d.id);
    if (!v) return;
    S.lastWrite = Date.now();
    await q(sb.from('visits').update({ open: !v.open }).eq('id', v.id));
    v.open = !v.open;
    logP(p, { kind: 'visit', text: `${v.open ? 'أعاد فتح' : 'أغلق'} متابعة: ${v.notes.slice(0, 60)}` });
    await flushLogs();
    render();
  },
  'del-visit': async d => {
    const p = S.p;
    const v = p.visits.find(x => x.id === d.id);
    if (!v || !(isAdmin() || v.createdBy === S.user.id) || !confirm('حذف هذه الملاحظة؟')) return;
    S.lastWrite = Date.now();
    await q(sb.from('visits').delete().eq('id', v.id));
    p.visits = p.visits.filter(x => x.id !== v.id);

  },

  /* المستخدمون */
  approve: async d => {
    if (!need('admin')) return;
    const u = userById(d.id);
    if (!u) return;
    const sel = $(`select[data-chg=role][data-id="${d.id}"]`);
    const role = sel ? sel.value : u.role;

    Object.assign(u, { status: 'active', role });

  },
  reject: async d => {
    if (!need('admin')) return;
    const u = userById(d.id);
    if (!u || !confirm(`رفض طلب ${u.name} وحذفه؟`)) return;
    await api('delete-user', { id: u.id });
    S.users = S.users.filter(x => x.id !== u.id);
    render();
  },
  'toggle-user': async d => {
    if (!need('admin')) return;
    const u = userById(d.id);
    if (!u || u.id === S.user.id || u.is_owner) return;
    const status = u.status === 'active' ? 'disabled' : 'active';
    await q(sb.from('profiles').update({ status }).eq('id', u.id));
    u.status = status;
    render();
  },
  'del-user': async d => {
    if (!need('admin')) return;
    const u = userById(d.id);
    if (!u || u.id === S.user.id || u.is_owner || !confirm(`حذف حساب ${u.name} نهائياً؟`)) return;
    await api('delete-user', { id: u.id });
    S.users = S.users.filter(x => x.id !== u.id);
    render();
  },

  export: async () => {
    if (!need('admin')) return;
    toast('جارٍ تجهيز النسخة…');
    const [projects, recs, vis] = await Promise.all([
      fetchAll(() => sb.from('projects').select('*').order('created_at')),
      fetchAll(() => sb.from('test_records').select('*').order('created_at')),
      fetchAll(() => sb.from('visits').select('*').order('created_at'))
    ]);
    const blob = new Blob([JSON.stringify({ exported: new Date().toISOString(), app: 'consulting-office', office: S.office, projects, test_records: recs, visits: vis }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'office-backup-' + dkey(Date.now()) + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
